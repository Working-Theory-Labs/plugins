<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pyramid board</title>
<style>
  :root { --ink:#1d1a17; --muted:#6b645c; --line:#cfc8bd; --paper:#f6f3ee; --card:#ffffff; --top:#2a1d17; --pill:#fbe3bd; --gap:#b3261e; --accent:#0f6b5c; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font:15px/1.4 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .board { max-width:1500px; margin:0 auto; padding:28px 32px 40px; }
  header { display:flex; justify-content:space-between; gap:24px; align-items:flex-end; margin-bottom:22px; }
  h1 { font-size:26px; margin:2px 0 0; }
  .eyebrow { font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); font-weight:700; }
  .meta { font-size:12px; color:var(--muted); text-align:right; }
  h2 { font-size:14px; margin:0 0 10px; }
  .grid { display:grid; grid-template-columns: minmax(0,3fr) minmax(280px,1fr); gap:28px; }
  .top { background:var(--top); color:#fff; border-radius:6px; padding:16px 20px; max-width:560px; margin:0 auto; }
  .top .eyebrow { color:#f2b56b; }
  .top .q { font-size:13px; margin:2px 0 10px; opacity:.92; }
  .top .a { font-size:19px; font-weight:700; line-height:1.25; }
  .stem { width:2px; height:16px; background:var(--line); margin:0 auto; }
  .raises { background:var(--pill); border-radius:999px; padding:7px 18px; max-width:520px; margin:0 auto; text-align:center; font-size:13px; }
  .raises b { text-transform:uppercase; }
  .rail { height:2px; background:var(--line); margin:0 auto; }
  .claims { display:grid; gap:14px; }
  .claim { position:relative; padding-top:16px; }
  .claim::before { content:""; position:absolute; top:0; left:50%; width:2px; height:16px; background:var(--line); }
  .claim .head { background:var(--card); border:2px solid var(--ink); border-radius:6px; padding:10px 12px; min-height:96px; }
  .claim .head .t { font-weight:700; font-size:15px; line-height:1.25; margin-top:3px; }
  .support { background:#ebe6dc; border-radius:4px; padding:8px 10px; margin-top:8px; font-size:13px; }
  .src { color:var(--muted); font-size:11px; }
  .support.invented { background:#fff; border:2px dashed var(--gap); }
  .support.invented .src { color:var(--gap); font-weight:700; }
  .gap { border:2px dashed var(--gap); color:var(--gap); background:#fff; border-radius:4px; padding:10px; margin-top:8px; font-size:13px; font-weight:700; }
  .panel { background:var(--card); border-radius:6px; padding:12px 14px; margin-bottom:12px; }
  .panel .t { font-weight:700; margin:2px 0 6px; }
  .panel p, .panel li { font-size:13px; margin:3px 0; }
  .panel ul { margin:0; padding-left:16px; }
  .lower { display:grid; grid-template-columns: 1fr 1fr; gap:28px; margin-top:28px; }
  .strip { background:var(--card); border-radius:6px; padding:14px 16px; }
  .strip .row { display:grid; grid-template-columns: 92px 1fr; gap:10px; padding:5px 0; }
  .strip .row.first { font-size:17px; font-weight:700; }
  .strip .row.frame { color:var(--muted); }
  table { width:100%; border-collapse:collapse; background:var(--card); border-radius:6px; font-size:13px; }
  th { text-align:left; font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); padding:10px 12px 6px; }
  td { padding:7px 12px; border-top:1px solid #eee8de; vertical-align:top; }
  td.g { color:var(--gap); font-weight:700; }
  .checks { margin-top:18px; font-size:12px; color:var(--muted); }
  .checks .bad { color:var(--gap); font-weight:700; }
  @media (max-width: 900px) { .grid, .lower { grid-template-columns:1fr; } .claims { grid-template-columns:1fr !important; } .rail { display:none; } }
</style>
</head>
<body>
<div class="board" id="board"></div>
<script id="pyramid-data" type="application/json">__PYRAMID_JSON__</script>
<script>
(function () {
  var d = JSON.parse(document.getElementById('pyramid-data').textContent);
  // What each medium calls its parts. The data never says "hero" or "section"; this table does.
  var MEDIA = {
    page: { top:'Hero headline', unit:'Section', need:'Page section it needs',
      kinds:{ examples:'Items: one card per example', numbers:'Stats: one figure each', steps:'Steps: numbered how-it-works', quotes:'Testimonials: one quote card each', questions:'FAQ: one question each', comparisons:'Comparison table' },
      frame:{ opening:'Hero subhead', trust:'Proof strip under the hero', objections:'FAQ', next:'Call to action' } },
    deck: { top:'Executive summary title', unit:'Slide', need:'Slide it needs',
      kinds:{ examples:'Case slide: one example each', numbers:'Chart slide', steps:'Process slide', quotes:'Quote slide', questions:'Q&A slide', comparisons:'Comparison slide' },
      frame:{ opening:'Situation slide', trust:'Credentials slide', objections:'Risks and answers slide', next:'Next steps slide' } },
    email: { top:'First sentence', unit:'Paragraph', need:'Form it takes',
      kinds:{ examples:'One example per line', numbers:'Figures in a short list', steps:'Numbered list', quotes:'One quoted line', questions:'Questions answered in turn', comparisons:'Two-column comparison' },
      frame:{ opening:'Opening line', trust:'One line of proof', objections:'A short "you may ask" list', next:'The ask, as the last line' } },
    document: { top:'Summary sentence', unit:'Section', need:'Form it takes',
      kinds:{ examples:'Worked examples', numbers:'Table or chart', steps:'Numbered procedure', quotes:'Pull quotes', questions:'Q&A section', comparisons:'Comparison table' },
      frame:{ opening:'Introduction', trust:'Evidence summary', objections:'Risks and answers', next:'Recommendation and next steps' } }
  };
  var M = MEDIA[d.medium] || MEDIA.page;
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function add(p) { for (var i = 1; i < arguments.length; i++) if (arguments[i]) p.appendChild(arguments[i]); return p; }
  function src(s) { return s ? el('span', 'src', ' (' + (s === 'invented' ? 'invented, not proof' : s) + ')') : null; }
  var board = document.getElementById('board');
  var claims = d.claims || [];
  var frame = d.frame || {};

  // Header
  var left = add(el('div'), el('div', 'eyebrow', (d.brand ? (d.piece || 'Piece') + ' · ' : '') + 'argument as a pyramid · ' + (d.medium || 'page')), el('h1', null, d.brand || d.piece || ''));
  var meta = el('div', 'meta');
  [['Reader', d.reader], ['The reader', d.opening === 'asked' ? 'asked the question' : 'arrives cold'], ['Mode', d.mode]].forEach(function (r) { if (r[1]) add(meta, el('div', null, r[0] + ': ' + r[1])); });
  add(board, add(el('header'), left, meta));

  // 1. The pyramid
  var pyr = el('div');
  add(pyr, el('h2', null, '1 · The pyramid'));
  var top = el('div', 'top');
  add(top, el('div', 'eyebrow', "Reader's question"), el('div', 'q', d.question || ''), el('div', 'eyebrow', 'Answer · ' + M.top.toLowerCase()), el('div', 'a', d.answer || ''));
  add(pyr, top, el('div', 'stem'));
  var raises = el('div', 'raises');
  var rk = (d.raises && d.raises.kind) || '';
  add(raises, document.createTextNode('The answer raises a '), el('b', null, rk), document.createTextNode(' question: ' + ((d.raises && d.raises.text) || '')));
  add(pyr, raises, el('div', 'stem'));
  var n = Math.max(claims.length, 1);
  var rail = el('div', 'rail'); rail.style.width = (100 - 100 / n) + '%';
  var row = el('div', 'claims'); row.style.gridTemplateColumns = 'repeat(' + n + ', minmax(0,1fr))';
  claims.forEach(function (c, i) {
    var col = el('div', 'claim'), items = c.support || [];
    var head = add(el('div', 'head'), el('div', 'eyebrow', 'Claim ' + (i + 1) + ' · ' + (c.support_kind || '?') + ' × ' + items.length), el('div', 't', c.claim));
    add(col, head);
    if (!items.length) add(col, el('div', 'gap', 'No proof yet. Needs ' + (c.support_kind || 'support') + '.'));
    items.forEach(function (s, j) { var b = el('div', 'support' + (s.source === 'invented' ? ' invented' : ''), (c.support_kind === 'steps' ? (j + 1) + '. ' : '') + s.text); add(b, src(s.source)); add(col, b); });
    add(row, col);
  });
  add(pyr, rail, row);

  // 2. What frames the argument
  var side = el('div');
  add(side, el('h2', null, '2 · Not claims: what frames the argument'));
  function panel(label, title, where, body) { var p = el('div', 'panel'); add(p, el('div', 'eyebrow', label), el('div', 't', title), el('div', 'src', 'In this ' + (d.medium || 'page') + ': ' + where), body); return p; }
  var o = frame.opening || {}, ob = el('div');
  [['Situation', o.situation], ['Complication', o.complication]].forEach(function (r) { if (r[1]) { var p = el('p'); add(p, el('b', null, r[0] + ': '), document.createTextNode(r[1])); add(ob, p); } });
  add(side, panel('Opening', d.opening === 'asked' ? 'The reader asked; keep it short.' : 'The reader sees the problem as theirs.', M.frame.opening, ob));
  function list(arr, empty) { if (!arr || !arr.length) return el('div', 'gap', empty); var u = el('ul'); arr.forEach(function (x) { var li = el('li', null, typeof x === 'string' ? x : x.text); if (x.source) add(li, src(x.source)); add(u, li); }); return u; }
  add(side, panel('Trust proof · ' + ((frame.trust || []).length), 'Why believe this at all', M.frame.trust, list(frame.trust, 'No trust proof yet.')));
  add(side, panel('Objections · ' + ((frame.objections || []).length), 'What could still stop the reader', M.frame.objections, list(frame.objections, 'No objections recorded yet.')));
  var ns = frame.next_step || {}, nb = el('div');
  [['Action', ns.action], ['Promise', ns.promise]].forEach(function (r) { if (r[1]) { var p = el('p'); add(p, el('b', null, r[0] + ': '), document.createTextNode(r[1])); add(nb, p); } });
  add(side, panel('The one next step', ns.action ? ns.action : 'Not set', M.frame.next, ns.action ? nb : el('div', 'gap', 'No next step yet.')));
  add(board, add(el('div', 'grid'), pyr, side));

  // 3. Headlines only   4. One line per unit
  var strip = el('div', 'strip');
  function line(label, text, cls) { return add(el('div', 'row ' + (cls || '')), el('div', 'eyebrow', label), el('div', null, text)); }
  add(strip, line(M.top, d.answer || '', 'first'));
  claims.forEach(function (c, i) { add(strip, line(M.unit + ' ' + (i + 1), c.claim)); });
  add(strip, line(M.frame.objections, 'What the reader asks before acting.', 'frame'), line(M.frame.next, ns.action || 'Not set', 'frame'));
  add(strip, el('div', 'src', 'Test: read only these lines, in order. Do they make the argument without anything else?'));
  var tbl = el('table'), hr = el('tr');
  [M.unit, 'Claim', 'Support', M.need].forEach(function (h) { add(hr, el('th', null, h)); });
  add(tbl, hr);
  claims.forEach(function (c, i) {
    var k = (c.support || []).length, tr = el('tr');
    add(tr, el('td', null, String(i + 1)), el('td', null, c.claim), el('td', k ? '' : 'g', k ? c.support_kind + ' × ' + k : 'none yet'), el('td', null, M.kinds[c.support_kind] || 'Not known for "' + c.support_kind + '"'));
    add(tbl, tr);
  });
  var lower = el('div', 'lower');
  add(lower, add(el('div'), el('h2', null, '3 · Headlines only'), strip), add(el('div'), el('h2', null, '4 · One line per ' + M.unit.toLowerCase()), tbl));
  add(board, lower);

  // Mechanical checks: structure only. Whether the argument is true is a person's call.
  var notes = [];
  if (claims.length < 2 || claims.length > 5) notes.push(['bad', claims.length + ' claims; a pyramid holds two to five.']);
  var gaps = claims.filter(function (c) { return !(c.support || []).length; }).length;
  if (gaps) notes.push(['bad', gaps + ' claim' + (gaps > 1 ? 's have' : ' has') + ' no proof yet. The outline stands; writing those parts waits for proof.']);
  var made = claims.filter(function (c) { return (c.support || []).some(function (x) { return x.source === 'invented'; }); }).length;
  if (made) notes.push(['bad', made + ' claim' + (made > 1 ? 's rest' : ' rests') + ' on invented items. They are placeholders, not proof, and are never written into a piece.']);
  if (!notes.length) notes.push(['', 'Structure checks pass: ' + claims.length + ' claims, each with support of one kind.']);
  var ck = el('div', 'checks'); notes.forEach(function (x) { add(ck, el('div', x[0], x[1])); }); add(board, ck);
})();
</script>
</body>
</html>
